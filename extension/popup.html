<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>NitroDrop</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="22" height="22">
    <h1>NitroDrop</h1>
    <span id="status" class="status" role="status"></span>
  </header>

  <section class="card" id="send-card">
    <div class="current">
      <img id="cur-icon" class="fav" alt="">
      <div class="current-text">
        <div id="cur-title" class="title">—</div>
        <div id="cur-host" class="sub"></div>
      </div>
    </div>
    <div class="label">Telefona/PC'ye gönder</div>
    <div id="targets" class="chips"></div>
    <div id="send-result" class="result" aria-live="polite"></div>
  </section>

  <h2>Diğer cihazlar</h2>
  <section id="devices"></section>

  <script src="popup.js"></script>
</body>
</html>
